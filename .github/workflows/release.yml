name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build distributable zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package.py --out "dist/daily-brief-${RELEASE_TAG}.zip"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber "$RELEASE_TAG" "dist/daily-brief-${RELEASE_TAG}.zip"
